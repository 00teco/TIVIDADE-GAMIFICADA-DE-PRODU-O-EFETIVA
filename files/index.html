<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Missão Lua – Jogo de Matemática</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <!-- TELA 1: escolha da operação -->
  <section id="tela-inicio" class="cartao">
    <div class="grande">🚀</div>
    <h1>Missão Lua</h1>
    <p class="suave">Resolva as contas para levar o foguete até a Lua. Acertou: ele avança. Errou: perde uma vida e recua. Se você acerta muito, as contas ficam mais difíceis!</p>
    <div class="operacoes">
      <button data-op="soma">➕ Adição</button>
      <button data-op="subtracao">➖ Subtração</button>
      <button data-op="multiplicacao">✖️ Multiplicação</button>
      <button data-op="divisao">➗ Divisão</button>
      <button data-op="mista" class="destaque" style="grid-column:1/3">🎲 Missão mista</button>
    </div>
  </section>

  <!-- TELA 2: jogo -->
  <section id="tela-jogo" class="oculto">
    <div class="painel">
      <span id="pontos">⭐ 0</span>
      <span id="nivel">Nível 1</span>
      <span id="vidas">❤️❤️❤️</span>
    </div>
    <div class="pista">
      <span class="terra">🌍</span><span class="lua">🌕</span>
      <span id="foguete">🚀</span>
    </div>
    <div class="barra"><div id="barra-progresso"></div></div>
    <p class="suave" id="texto-progresso">Etapa 0 de 10</p>

    <div class="cartao" id="cartao-questao">
      <div id="pergunta"></div>
      <form id="formulario" autocomplete="off">
        <input id="resposta" type="number" inputmode="numeric" placeholder="Sua resposta" required>
        <button type="submit" class="destaque" id="enviar">Enviar</button>
      </form>
      <div id="feedback" aria-live="polite"></div>
    </div>
  </section>

  <!-- TELA 3: resultado -->
  <section id="tela-fim" class="cartao oculto">
    <div class="grande" id="fim-icone"></div>
    <h1 id="fim-titulo"></h1>
    <p class="suave" id="fim-texto"></p>
    <button class="destaque" id="reiniciar" style="width:100%">Jogar de novo</button>
  </section>
</main>
<script src="game.js"></script>
</body>
</html>
